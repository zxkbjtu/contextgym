name: Feature request
description: Suggest a ContextGym capability or workflow improvement.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - History parsing
        - Friction mining
        - Proposal generation
        - A/B evaluation
        - Reports / UX
        - Claude Code support
        - Other
    validations:
      required: true
