<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">ContextGym — Test your context before you keep it</title>
  <desc id="desc">Experiment-driven context optimization for coding agents with a real Codex A/B benchmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72a7ff"/>
      <stop offset="1" stop-color="#8b78ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="220" fill="#4e6cff" opacity="0.08"/>
  <circle cx="1080" cy="520" r="280" fill="#36e0aa" opacity="0.05"/>

  <!-- mark -->
  <g transform="translate(56 54)">
    <path d="M0 10h22M0 10v72M0 82h22" stroke="#72a7ff" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M92 10H70M92 10v72M92 82H70" stroke="#8b78ff" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M31 47h30" stroke="#9cb7de" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 74l12 12 26-31" stroke="#50e7aa" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <text x="176" y="105" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">Context<tspan fill="url(#brand)">Gym</tspan></text>
  <text x="56" y="180" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="760">Test your context before you keep it.</text>
  <text x="56" y="224" fill="#9fb2d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23">Experiment-driven context optimization for coding agents.</text>

  <!-- command -->
  <g filter="url(#shadow)">
    <rect x="56" y="262" width="560" height="72" rx="16" fill="#111c33" stroke="#2a3a5f"/>
    <text x="84" y="307" fill="#56e8ad" font-family="Consolas,Menlo,monospace" font-size="21">$ npx contextgym optimize --project ./my-repo</text>
  </g>

  <!-- benchmark card -->
  <g filter="url(#shadow)">
    <rect x="656" y="54" width="488" height="360" rx="22" fill="#101a2e" stroke="#2a3a5f"/>
    <text x="688" y="98" fill="#8eb5ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">REAL CODEX A/B EXPERIMENT</text>
    <text x="688" y="132" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Same task. Same verifier. +64 context tokens.</text>

    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="688" y="188" fill="#9fb2d5" font-size="16">Success</text>
      <text x="1098" y="188" text-anchor="end" fill="#50e7aa" font-size="27" font-weight="800">100% → 100%</text>

      <text x="688" y="242" fill="#9fb2d5" font-size="16">Tokens</text>
      <text x="1098" y="242" text-anchor="end" fill="#50e7aa" font-size="27" font-weight="800">−53.9%</text>

      <text x="688" y="296" fill="#9fb2d5" font-size="16">Observed tools</text>
      <text x="1098" y="296" text-anchor="end" fill="#50e7aa" font-size="27" font-weight="800">−56.3%</text>

      <text x="688" y="350" fill="#9fb2d5" font-size="16">Duration</text>
      <text x="1098" y="350" text-anchor="end" fill="#50e7aa" font-size="27" font-weight="800">−29.4%</text>
    </g>

    <rect x="688" y="372" width="180" height="30" rx="15" fill="#12342f" stroke="#2b7a63"/>
    <text x="778" y="393" text-anchor="middle" fill="#62efb5" font-family="Consolas,Menlo,monospace" font-size="14" font-weight="700">KEEP_EFFICIENCY</text>
    <text x="1098" y="393" text-anchor="end" fill="#9fb2d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">paired token wins 3/3</text>
  </g>

  <!-- value statement -->
  <rect x="56" y="380" width="560" height="112" rx="18" fill="#0d182c" stroke="#203456"/>
  <text x="84" y="420" fill="#f7f9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">ContextGym does not just generate AGENTS.md.</text>
  <text x="84" y="455" fill="#9fb2d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">It tests whether the proposed context actually helps.</text>

  <!-- pipeline -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">
    <rect x="56" y="530" width="154" height="50" rx="14" fill="#111c33" stroke="#2a3a5f"/><text x="133" y="561" text-anchor="middle" fill="#dce7ff">Agent history</text>
    <text x="229" y="561" fill="#60779f" font-size="22">→</text>
    <rect x="258" y="530" width="154" height="50" rx="14" fill="#111c33" stroke="#2a3a5f"/><text x="335" y="561" text-anchor="middle" fill="#dce7ff">Find friction</text>
    <text x="431" y="561" fill="#60779f" font-size="22">→</text>
    <rect x="460" y="530" width="154" height="50" rx="14" fill="#111c33" stroke="#2a3a5f"/><text x="537" y="561" text-anchor="middle" fill="#dce7ff">Propose context</text>
    <text x="633" y="561" fill="#60779f" font-size="22">→</text>
    <rect x="662" y="530" width="154" height="50" rx="14" fill="#111c33" stroke="#2a3a5f"/><text x="739" y="561" text-anchor="middle" fill="#dce7ff">A/B test</text>
    <text x="835" y="561" fill="#60779f" font-size="22">→</text>
    <rect x="864" y="530" width="132" height="50" rx="14" fill="#111c33" stroke="#2a3a5f"/><text x="930" y="561" text-anchor="middle" fill="#dce7ff">Measure ROI</text>
    <text x="1015" y="561" fill="#60779f" font-size="22">→</text>
    <rect x="1044" y="530" width="100" height="50" rx="14" fill="#12342f" stroke="#2b7a63"/><text x="1094" y="561" text-anchor="middle" fill="#62efb5">KEEP</text>
  </g>
</svg>
